name: Upload data from fauna to S3

# Only support manual trigger of this workflow.
on:
  workflow_dispatch:
    inputs:
      triggerAvianFlu:
        description: "Trigger nextstrain/avian-flu GenoFLU workflow"
        type: boolean
        required: true
      triggerForecastsFlu:
        description: "Trigger forecasts-flu models"
        required: true
        type: boolean
      forecastsFluDockerImage:
        description: "Specific container image to use for forecasts-flu models"
        required: false
        type: string
      triggerPublic:
        description: "Trigger Nextstrain public builds after the forecasts-flu workflow, only used if triggerForecastsFlu is true"
        required: true
        type: boolean
      publicDockerImage:
        description: "Specific container image to use for Nextstrain public builds"
        required: false
        type: string
      triggerNextfluPrivate:
        description: "Trigger nextflu-private group builds after the forecasts-flu workflow, only used if triggerForecastsFlu is true"
        required: true
        type: boolean
      nextfluPrivateDockerImage:
        description: "Specific container image to use for nextflu-private group builds"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  # Only cancel in progress workflow if the workflow is running on the default branch
  cancel-in-progress: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  ingest:
    permissions:
      id-token: write
    uses: ./.github/workflows/ingest.yaml
    with:
      # Trigger avian flu in a separate job to prevent error from failing
      # the rest of the upload workflow
      triggerAvianFlu: false
      artifact-name: build-outputs-ingest
    secrets: inherit

  trigger_avian_flu:
    needs: [ingest]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.triggerAvianFlu }}
        name: Trigger avian-flu/genoflu-gisaid.yaml
        run: |
          gh workflow run \
            genoflu-gisaid.yaml \
            --repo nextstrain/avian-flu
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_NEXTSTRAIN_BOT_WORKFLOW_DISPATCH }}

  upload_titers:
    # Depends on ingest since titer should be checked against sequence strains
    needs: [ingest]
    permissions:
      id-token: write
    uses: nextstrain/.github/.github/workflows/pathogen-repo-build.yaml@master
    secrets: inherit
    with:
      artifact-name: build-outputs-upload
      runtime: docker
      run: |
        nextstrain build \
          --env RETHINK_AUTH_KEY \
          --env RETHINK_HOST \
          . \
          -j 4 \
          upload_all_titers \
          --configfile profiles/upload.yaml

  trigger_forecasts_flu:
    needs: [upload_titers]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.triggerForecastsFlu }}
        name: Trigger forecasts-flu/run-models
        run: |
          gh workflow run \
            run-models.yaml \
            --repo nextstrain/forecasts-flu \
            -f dockerImage=${{ inputs.forecastsFluDockerImage }} \
            -f triggerPublic=${{ inputs.triggerPublic }} \
            -f publicDockerImage=${{ inputs.publicDockerImage }} \
            -f triggerNextfluPrivate=${{ inputs.triggerNextfluPrivate }} \
            -f nextfluPrivateDockerImage=${{ inputs.nextfluPrivateDockerImage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_NEXTSTRAIN_BOT_WORKFLOW_DISPATCH }}
